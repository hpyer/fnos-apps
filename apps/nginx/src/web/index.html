<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nginx for fnOS</title>
  <link rel="stylesheet" href="./index.css">
  <script src="./index.js" type="module"></script>
</head>
<body>
  <header class="topbar" aria-label="服务控制">
    <div class="actions service-actions"><button id="start" type="button">启动</button><button id="stop" type="button" hidden>停止</button><button id="restart" type="button" hidden>重启</button></div>
    <div class="service-summary"><strong>运行状态</strong><div class="status"><span id="dot" class="dot"></span><span id="running">读取中</span><span class="divider"></span><span id="active">未选择版本</span></div></div>
    <div class="actions reload-actions"><button id="reload" type="button" class="primary">校验并重载配置</button></div>
  </header>
  <main>
    <section class="panel sites"><div class="panel-head"><div><h2>站点配置 <span id="site-count" class="count">0</span></h2><p>应用以非 root 用户运行，只能监听 1024 及以上端口；每个文件包含一个或多个 server 块</p></div><div class="actions"><button id="edit-config" type="button">编辑主配置</button><button id="new-site" type="button" class="primary">新增站点</button></div></div><div id="site-list" class="site-list"></div></section>
    <div class="bottom-grid">
      <section class="panel versions"><div class="panel-head"><div><h2>Nginx 版本</h2><p>从 nginx.org 官方软件包仓库获取</p></div></div>
        <div class="version-tools"><label for="channel">更新通道</label><select id="channel"><option value="stable">稳定版</option><option value="mainline">主线版</option></select><button id="check-version" type="button">检查更新</button></div>
        <div class="latest"><div><span class="muted">最新版本</span><strong id="latest-version">尚未检查</strong><small id="latest-detail">默认检查稳定版</small></div><button id="install-version" type="button" class="primary" disabled>下载并安装</button></div>
        <details class="installed"><summary>已安装版本 <span id="version-count">0</span></summary><div id="version-list" class="version-list"></div></details>
      </section>
      <section class="panel notification"><div class="panel-head"><div><h2>证书更新通知</h2><p>证书服务写入新时间戳后自动重载</p></div><label class="toggle"><input id="notify-enabled" type="checkbox"><span>启用</span></label></div>
        <div class="notify-fields"><div class="path-field"><label for="notify-path">NAS 通知文件绝对路径</label><input id="notify-path" type="text" placeholder="/vol1/@appshare/nginx-for-fnos/nginx.reload" spellcheck="false"></div><div class="interval-field"><label for="notify-interval">间隔（分钟）</label><input id="notify-interval" type="number" min="1" max="1440" value="30"></div></div>
        <div class="notify-actions"><button id="test-path" type="button">测试并创建文件</button><button id="check-notify" type="button">立即检查</button><button id="save-notify" type="button" class="primary">保存设置</button></div><p id="notify-state" class="hint"></p>
      </section>
    </div>
  </main>
  <dialog id="site-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><div><h2 id="dialog-title">新增站点</h2><p>非 root 权限只能监听 1024 及以上端口；保存时会校验整套配置。</p></div><button id="close-dialog" type="button" class="icon-button" aria-label="关闭">×</button></div>
    <div class="dialog-body">
      <label for="site-name">文件名</label>
      <div class="site-name-field"><input id="site-name" type="text" placeholder="example.com" spellcheck="false" autocomplete="off" aria-describedby="site-extension"><span id="site-extension">.conf</span></div>
      <label for="site-source">配置内容</label>
      <textarea id="site-source" spellcheck="false" placeholder="server {&#10;    listen 8080;&#10;    server_name example.com;&#10;}"></textarea>
    </div>
    <div class="dialog-foot"><button id="delete-site" type="button" class="danger" hidden>删除站点</button><span class="spacer"></span><button id="cancel-dialog" type="button">取消</button><button id="save-site" type="button" class="primary">校验并保存</button></div>
  </dialog>
  <dialog id="config-dialog" aria-labelledby="config-dialog-title">
    <div class="dialog-head"><div><h2 id="config-dialog-title">编辑主配置</h2><p>非 root 权限只能监听 1024 及以上端口；请保留站点 include 行。</p></div><button id="close-config" type="button" class="icon-button" aria-label="关闭">×</button></div>
    <div class="dialog-body config-dialog-body"><label for="config-source">nginx.conf</label><textarea id="config-source" spellcheck="false"></textarea></div>
    <div class="dialog-foot"><span class="spacer"></span><button id="cancel-config" type="button">取消</button><button id="save-config" type="button" class="primary">校验并保存</button></div>
  </dialog>
</body>
</html>
