<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Xterm for fnOS</title>
    <link rel="icon" href="./icon.png" />
    <link rel="stylesheet" href="./index.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <header>
      <img src="./icon.png" width="30" height="30" alt="" />
      <h1>Xterm <span>for fnOS</span></h1>
      <nav aria-label="终端操作">
        <button id="connect" class="primary">连接终端</button
        ><button id="disconnect" disabled>断开</button
        ><button id="clear">清屏</button>
      </nav>
    </header>
    <div class="context">
      <span id="identity">应用包用户 · 本机 Shell</span
      ><span id="status" role="status" aria-live="polite">未连接</span>
    </div>
    <main>
      <div id="terminal" aria-label="交互式终端"></div>
      <div id="empty">
        <strong>打开本机终端</strong>
        <p>以应用包用户运行 Bash。断开连接后结束会话。</p>
        <p>点击「连接终端」开始。</p>
      </div>
    </main>
    <footer>
      <span>单会话 · 关闭窗口后结束</span><span id="size">—</span>
    </footer>
  </body>
</html>
