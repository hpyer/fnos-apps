<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS 服务</title><link rel="stylesheet" href="./index.css"></head><body><main id="app"><header><div><p class="eyebrow">NETWORK SERVICE</p><h1>DNS 服务</h1><p class="muted">管理本机 DNS 缓存、上游服务器和域名解析记录</p></div><span id="status" class="pill">读取中</span></header><nav><button data-page="overview" class="active">概览</button><button data-page="settings">DNS 设置</button><button data-page="records">解析记录</button><button data-page="diagnostics">诊断</button></nav><section id="overview" class="page active"><div class="card hero"><div><p class="eyebrow">SERVICE STATUS</p><h2 id="service-state">读取中</h2><p id="service-detail" class="muted">正在读取服务状态</p></div><div class="actions"><button id="start" class="primary">启动</button><button id="stop">停止</button><button id="restart">重启</button></div></div><div class="grid"><div class="card"><h3>监听地址</h3><p id="listen-summary" class="value">—</p></div><div class="card"><h3>上游 DNS</h3><p id="upstream-summary" class="value">—</p></div><div class="card"><h3>解析记录</h3><p id="record-summary" class="value">—</p></div></div></section><section id="settings" class="page"><div class="card"><h2>DNS 设置</h2><form id="settings-form"><label>监听地址<span>每行一个 IPv4 或 IPv6 地址</span><textarea id="listen" rows="3"></textarea></label><label>上游 DNS<span>不使用系统 resolv.conf</span><textarea id="upstreams" rows="3"></textarea></label><label>缓存大小<input id="cache" type="number" min="0" max="100000"></label><label class="check"><input id="logging" type="checkbox">记录 DNS 查询日志</label><label class="check"><input id="auto" type="checkbox">应用启动时自动启动 DNS</label><button class="primary" type="submit">保存并应用</button></form></div></section><section id="records" class="page"><div class="card"><div class="section-title"><div><h2>解析记录</h2><p class="muted">精确记录匹配单个域名，后缀记录匹配该域名及其子域名。</p></div><button id="add-record">新增记录</button></div><div id="records-list"></div><form id="record-form" class="record-form hidden"><select id="record-type"><option value="exact">精确记录</option><option value="suffix">后缀记录</option></select><input id="record-domain" placeholder="例如 nas.example.com" required><input id="record-addresses" placeholder="IP 地址，逗号分隔" required><button class="primary" type="submit">添加</button><button type="button" id="cancel-record">取消</button></form></div></section><section id="diagnostics" class="page"><div class="card"><div class="section-title"><div><h2>诊断</h2><p class="muted">用于确认二进制、配置和目标环境。</p></div><button id="refresh-diagnostics">刷新</button></div><pre id="diagnostic-output">—</pre></div></section><div id="toast" role="status"></div></main><script type="module" src="./index.js"></script></body></html>
